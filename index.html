<script>
/* === MODO CELULAR: solo en telefonos (tactil + lado menor < 600px). Tablets y PC no cambian. === */
(function(){try{
  var p=new URLSearchParams(location.search).get('vista');
  if(p==='celu'||p==='full')localStorage.setItem('wf_vista',p);
  if(p==='auto')localStorage.removeItem('wf_vista');
  var pref=localStorage.getItem('wf_vista');
  var lado=Math.min(screen.width||9999,screen.height||9999);
  var tactil=(navigator.maxTouchPoints>0)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
  var esTel=!!tactil&&lado<600;
  window.WF_ES_TEL=esTel;
  if(pref==='celu'||(esTel&&pref!=='full')){var de=document.documentElement;de.classList.add('celu');
    /* si el navegador fuerza "sitio de escritorio" (ventana virtual ~980px) se agranda todo a tamano real */
    var ajusta=function(){try{
      var land=window.matchMedia&&matchMedia('(orientation:landscape)').matches;
      var sw=land?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height), iw=window.innerWidth||0;
      var z=(sw&&iw>sw*1.2)?(iw/sw):1;
      de.style.zoom=z>1?z:'';
      if(z>1){de.style.setProperty('--wfh',Math.floor(window.innerHeight/z)+'px');de.classList.add('celu-zoom')}
      else{de.style.removeProperty('--wfh');de.classList.remove('celu-zoom')}
    }catch(e){}};
    ajusta();window.addEventListener('resize',ajusta);window.addEventListener('orientationchange',function(){setTimeout(ajusta,250)});}
}catch(e){}})();
</script>
<style>
:root{
  --bg:#eef1f3; --card:#ffffff; --ink:#1a2622; --ink2:#48564f; --muted:#8a958f;
  --line:#e7ebed; --line2:#f2f5f6;
  --teal:#15a463; --teal-d:#0e8551; --teal-l:#e3f6ec; --teal-l2:#f2fbf6;
  --amber:#e8731e; --amber-l:#fdeede;
  --green:#15a463; --green-l:#e3f6ec;
  --yellow:#e0950a; --yellow-l:#fdf3da;
  --red:#e25555; --red-l:#fdecec;
  --blue:#2c74c4; --blue-l:#e9f1fb;
  --shadow:0 1px 2px rgba(26,38,34,.04),0 6px 22px rgba(26,38,34,.05);
  --shadow-lg:0 18px 50px rgba(26,38,34,.16);
  --r:18px; --r-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
body{background-image:radial-gradient(circle at 15% -10%,rgba(21,164,99,.08),transparent 45%),radial-gradient(circle at 100% 0%,rgba(232,115,30,.06),transparent 38%);min-height:100vh}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:-.01em;line-height:1.15}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:14px}
a{color:var(--teal);text-decoration:none}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#f6faf8,#e9f2ed);padding:24px}
.login-card{background:var(--card);border-radius:22px;padding:36px 32px;width:100%;max-width:380px;box-shadow:var(--shadow-lg);text-align:center}
.login-card .logo{font-family:'Archivo';font-weight:800;font-size:30px;letter-spacing:-.03em;color:var(--teal)}
.login-card .logo span{color:var(--amber)}
.login-card .logo-img{display:block;width:200px;max-width:72%;height:auto;margin:2px auto 6px}
.login-card h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:24px;letter-spacing:0;color:var(--ink);margin:10px 0 2px}
.login-card p{color:var(--muted);font-size:13px;margin:2px 0 24px}
.pin-field{position:relative;margin-bottom:16px}
.pin-field input{width:100%;height:56px;border:1.5px solid var(--line);border-radius:13px;background:#fff;
  text-align:center;font-family:'IBM Plex Mono';font-size:30px;font-weight:600;letter-spacing:.5em;
  color:var(--ink);padding:0 0 0 .5em;transition:.15s;outline:none;box-sizing:border-box}
.pin-field input::placeholder{letter-spacing:.18em;font-size:15px;font-weight:500;color:var(--muted)}
.pin-field input:focus{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-l)}
.pin-field input.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.login-btn{width:100%;height:50px;border:none;border-radius:13px;background:var(--teal);color:#fff;
  font-family:'Archivo';font-weight:700;font-size:15px;letter-spacing:.02em;cursor:pointer;transition:.15s}
.login-btn:hover{background:#084f49}
.login-btn:active{transform:scale(.98)}
.login-err{color:var(--red);font-size:13px;height:18px;margin-top:14px;font-weight:500}

/* ---------- SHELL ---------- */
#app{display:none;max-width:1320px;margin:0 auto;padding:0 20px 60px}
header.top{display:flex;align-items:center;gap:18px;padding:18px 4px 16px;flex-wrap:wrap}
.brand{font-family:'Archivo';font-weight:800;font-size:22px;letter-spacing:-.03em;color:var(--teal);white-space:nowrap}
.brand span{color:var(--amber)}
.brand-img{display:block;height:38px;width:auto}
.brand small{display:block;font-family:'IBM Plex Sans';font-weight:500;font-size:11px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.top-spacer{flex:1}
.tc-box{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 14px;box-shadow:var(--shadow)}
.tc-box .lab{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;line-height:1.1}
.tc-box .lab b{display:block;font-size:9px;color:var(--teal);font-weight:600}
.tc-box input{width:78px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:right;font-weight:600;color:var(--ink);background:var(--teal-l2)}
.tc-box .src{font-size:10px;color:var(--muted);max-width:120px;line-height:1.25}
.tc-box .src b{color:var(--green)}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--shadow);transition:.14s}
.icon-btn:hover{border-color:var(--teal);background:var(--teal-l)}

/* nav */
nav.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px;box-shadow:var(--shadow);margin-bottom:22px;overflow-x:auto}
body.modo-modulo #tabs{display:none}
nav.tabs button{flex:1;min-width:120px;border:none;background:transparent;padding:11px 14px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;white-space:nowrap}
nav.tabs button .dot{width:9px;height:9px;border-radius:3px}
nav.tabs button:hover{background:var(--line2)}
nav.tabs button.active{background:var(--teal);color:#fff;box-shadow:0 6px 16px rgba(21,164,99,.30)}
nav.tabs button.active .dot{background:rgba(255,255,255,.85)!important}

.page{display:none;animation:fade .3s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- COMMON UI ---------- */
.section-head{display:flex;align-items:flex-end;gap:14px;margin:4px 2px 16px;flex-wrap:wrap}
.section-head h2{font-size:24px}
.section-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
.section-head .sh-spacer{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line2)}
.card-h h3{font-size:15px}
.card-h .tag{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:880px){.g2,.g3,.g4{grid-template-columns:1fr}}

.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 15px;border-radius:10px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.14s;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--teal);background:var(--teal-l)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-d)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.amber:hover{filter:brightness(.94)}
.btn.ghost{box-shadow:none;background:transparent}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}

/* stats */
.stat{padding:16px 18px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.stat .v{font-family:'Archivo';font-weight:700;font-size:27px;letter-spacing:-.02em;margin-top:4px}
.stat .v small{font-size:14px;color:var(--muted);font-weight:600}
.stat .d{font-size:12px;color:var(--muted);margin-top:3px}
.stat.accent{background:linear-gradient(140deg,var(--teal),var(--teal-d));color:#fff;border-color:var(--teal-d)}
.stat.accent .k{color:rgba(255,255,255,.75)}
.stat.accent .d{color:rgba(255,255,255,.78)}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}
table th{background:var(--card);color:var(--muted);font-weight:600;text-align:right;padding:12px 14px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1.5px solid var(--line);white-space:nowrap;position:sticky;top:0}
table th:first-child,table td:first-child{text-align:left}
table td{padding:11px 14px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
table tr:last-child td{border-bottom:none}
table tbody tr:hover{background:var(--teal-l2)}
table .num{font-family:'IBM Plex Mono';font-variant-numeric:tabular-nums}
table tr.total td{font-weight:700;background:var(--teal-l);border-top:1.5px solid var(--teal)}
.tinp{width:100%;max-width:92px;border:1px solid var(--line);border-radius:9px;padding:6px 9px;text-align:right;font-family:'IBM Plex Mono';background:var(--line2);color:var(--ink);transition:.13s;-moz-appearance:textfield;appearance:textfield}
.tinp::-webkit-outer-spin-button,.tinp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tinp:hover{background:#fff;border-color:#d3dad8}
.tinp:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 3px var(--teal-l)}
.tinp.edited{border-color:var(--amber);background:var(--amber-l)}
.tsel{border:1px solid var(--line);border-radius:7px;padding:5px 7px;background:#fff}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;line-height:1.4}
.pill::before{content:'';width:7px;height:7px;border-radius:50%}
.pill.v{background:var(--green-l);color:var(--green)}.pill.v::before{background:var(--green)}
.pill.a{background:var(--yellow-l);color:var(--yellow)}.pill.a::before{background:var(--yellow)}
.pill.r{background:var(--red-l);color:var(--red)}.pill.r::before{background:var(--red)}
.delta{font-weight:600;font-size:12px}
.delta.up{color:var(--green)}.delta.down{color:var(--red)}.delta.flat{color:var(--muted)}

/* labeled inputs (params) */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:12px;font-weight:600;color:var(--ink2)}
.field label small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:1px}
.field .iw{display:flex;align-items:center;gap:8px}
.field input,.field select{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--line2);color:var(--ink);font-family:'IBM Plex Mono'}
.field input:focus,.field select:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 3px var(--teal-l)}
.field .unit{font-size:12px;color:var(--muted);min-width:48px}
.params-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
@media(max-width:680px){.params-grid{grid-template-columns:1fr}}
.params-sub{grid-column:1/-1;font-family:'Archivo';font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--teal);margin:14px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line2)}

/* breakdown bar */
.bd{display:flex;height:13px;border-radius:7px;overflow:hidden;margin:10px 0 6px;background:var(--line2)}
.bd span{height:100%}
.bd-leg{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:11.5px;color:var(--ink2)}
.bd-leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,30,28,.5);backdrop-filter:blur(3px);z-index:150;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;overflow-x:hidden;box-shadow:var(--shadow-lg);animation:pop .22s ease}
.modal.wide{max-width:840px}
@media(max-width:900px){.modal.wide{max-width:560px}}
.gauto{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.gauto>*{min-width:0}
.gkpi{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.gkpi>*{min-width:0}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal-h{padding:20px 22px 0;display:flex;align-items:flex-start;gap:12px}
.modal-h h3{font-size:19px;flex:1}
.modal-h .x{border:none;background:var(--line2);width:32px;height:32px;border-radius:9px;font-size:17px;color:var(--ink2)}
.modal-h .x:hover{background:var(--red-l);color:var(--red)}
.modal-b{padding:16px 22px 22px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:0 22px 22px}

/* simulator */
.sim-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 70px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px}
.sim-row.head{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--line)}
.sim-row input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;text-align:right;font-family:'IBM Plex Mono';background:var(--line2);width:100%}
.sim-row .base{color:var(--muted);font-family:'IBM Plex Mono';text-align:right}

.banner{padding:12px 16px;border-radius:11px;font-size:13px;display:flex;align-items:center;gap:10px;margin-bottom:16px}
.banner.warn{background:var(--amber-l);color:#8a5212;border:1px solid #f0d7b3}
.banner.info{background:var(--blue-l);color:#1d4e82;border:1px solid #c5dcf2}
.banner.ok{background:var(--green-l);color:#15703d;border:1px solid #bfe6cf}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s;z-index:300}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green)}
.empty{text-align:center;color:var(--muted);padding:34px 16px;font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:7px;background:var(--line2);color:var(--ink2)}
.chip.teal{background:var(--teal-l);color:var(--teal)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.mini-x{border:none;background:transparent;color:var(--muted);font-size:15px;padding:2px 6px;border-radius:6px}
.mini-x:hover{background:var(--red-l);color:var(--red)}
.search{border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:200px;background:#fff}
.search:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l)}

/* ---------- SUB-NAV (Costos / Precios dentro de cada línea) ---------- */
.subnav{display:inline-flex;gap:4px;background:var(--line2);border:1px solid var(--line);border-radius:13px;padding:4px;margin:0 2px 18px}
.subnav button{border:none;background:transparent;padding:8px 20px;border-radius:10px;font-weight:600;font-size:13px;color:var(--ink2);transition:.14s}
.subnav button:hover{color:var(--ink)}
.subnav button.active{background:var(--card);color:var(--teal);box-shadow:var(--shadow)}
/* fórmula bajo cada componente de costo (paso a paso) */
.formula{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted);line-height:1.5;font-weight:400}
td .formula{display:block;margin-top:3px;white-space:normal}
/* matriz de recetas */
.matrix td,.matrix th{padding:8px 9px}
.matrix .badrow td{background:var(--red-l)}
/* fila desplegable de detalle */
.exp-row td{background:var(--teal-l2);border-bottom:1px solid var(--line)!important}
.exp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px 20px;text-align:left;padding:6px 2px}
.exp-grid .ei{font-size:12px;color:var(--ink2)}
.exp-grid .ei b{display:block;font-family:'IBM Plex Mono';font-size:14px;color:var(--ink);font-weight:600;margin-top:1px}
.exp-grid .ei .ef{display:block;font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);margin-top:1px}
.lnk{cursor:pointer;color:var(--teal);font-weight:600;font-size:11.5px;white-space:nowrap}
.lnk:hover{text-decoration:underline}
/* fila de variante clickeable + build-up por variante */
.clickrow td{transition:background .12s}
.clickrow:hover td{background:var(--teal-l)}
.accent-num{color:var(--teal)}
.buildup .bu{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;border-bottom:1px dashed var(--line);font-size:12.5px;color:var(--ink2)}
.buildup .bu b{font-family:'IBM Plex Mono';color:var(--ink)}
.buildup .bu.op{color:var(--muted)}
.buildup .bu.sum b{color:var(--teal)}
.buildup .bu.grand{border-bottom:none;font-weight:600;font-size:14px;color:var(--ink)}
.buildup .bu.grand b{color:var(--teal)}
/* barra de filtros */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:auto}
.filterbar .search{margin-left:0}
  tr.row-inact{ opacity:.5; background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(0,0,0,.02) 6px,rgba(0,0,0,.02) 12px); }
  tr.row-inact .tinp{ background:#f6f6f6; }
  .tinp.emp-man{ border-color:var(--amber); background:#fffdf5; font-weight:600; }
  .th-sort{ cursor:pointer; user-select:none; white-space:nowrap; }
  .th-sort:hover{ color:var(--teal); }
  .sort-i{ opacity:.45; font-size:9px; margin-left:3px; }
  .th-sort:hover .sort-i{ opacity:.9; }
  .chk-act input{ width:16px;height:16px;cursor:pointer;accent-color:var(--teal); }
  .tinp.precio-vig{ border:1.5px solid var(--teal); background:#fff; font-weight:600; }
  .tinp.precio-vig:focus{ box-shadow:0 0 0 3px rgba(31,143,83,.15); }
  td.hist-cell{ text-align:right; padding-right:10px; }

/* ================= MODO CELULAR (todo bajo html.celu: no afecta tablet ni PC) ================= */
#c-nav{display:none}
html.celu body{font-size:15px;background-image:none}
html.celu input,html.celu select,html.celu textarea{font-size:16px!important}
html.celu #app{padding:0 12px calc(110px + env(safe-area-inset-bottom,0px))}
/* barra superior */
html.celu header.top{position:sticky;top:0;z-index:30;margin:0 -12px 14px;padding:9px 12px 8px;gap:7px 8px;background:#fff;border-bottom:3px solid var(--teal);box-shadow:0 2px 10px rgba(26,38,34,.07);flex-wrap:wrap}
html.celu .brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
html.celu .brand-img{height:28px}
html.celu .brand small{margin:0;font-family:'Archivo';font-weight:700;font-size:16.5px;letter-spacing:0;text-transform:none;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.celu .top-spacer,html.celu header.top .icon-btn{display:none!important}
html.celu .tc-box{padding:4px 8px;gap:8px;border-radius:12px;box-shadow:none;flex:1 0 100%;background:var(--teal-l2)}
html.celu .tc-box .lab{flex:1;min-width:0;display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden}
html.celu .tc-box .lab b{display:inline;font-size:10px;overflow:hidden;text-overflow:ellipsis}
html.celu .tc-box .lab{font-size:10px}
html.celu .tc-box input{width:70px;padding:6px;font-size:14px!important}
html.celu .tc-box .src{display:none}
html.celu .tc-box .btn,html.celu .tc-box .btn.sm{padding:6px 10px;font-size:0;flex:none}
html.celu .tc-box .btn::before{content:'\27F3';font-size:16px}
/* barra de abajo */
html.celu nav.tabs,html.celu body.modo-modulo #tabs{display:none!important}
html.celu #c-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(26,38,34,.08)}
html.celu #c-nav button{flex:1 1 0;min-width:0;border:0;background:none;font-size:10px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 1px;white-space:nowrap}
html.celu #c-nav button span{font-size:20px;line-height:1.1;filter:grayscale(1);opacity:.6}
html.celu #c-nav button.on{color:var(--teal-d)}
html.celu #c-nav button.on span{filter:none;opacity:1}
.sheet-ov{position:fixed;inset:0;background:rgba(15,30,28,.5);z-index:140;display:none;align-items:flex-end}
.sheet-ov.open{display:flex}
.sheet{width:100%;max-height:84%;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom,0px));animation:shup .18s}
@keyframes shup{from{transform:translateY(30px);opacity:0}}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:#d3dad8;margin:2px auto 10px}
.sheet h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 6px 4px}
.sheet button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 8px;font-size:16px;font-weight:600;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line2);text-align:left}
.sheet button .ic{font-size:20px;width:26px;text-align:center}
.sheet button.on{color:var(--teal-d)}
.sheet button.sal{color:var(--red);border-bottom:0}
/* contenido */
html.celu .page.active{animation:none}
html.celu .section-head{margin:0 2px 12px;gap:8px}
html.celu .section-head h2{display:none}
html.celu .section-head .sub{font-size:13px;margin:0}
html.celu .section-head .sh-spacer{display:none}
html.celu .section-head .btn,html.celu .filterbar .btn{flex:1 1 auto;justify-content:center}
html.celu .filterbar{margin-left:0;width:100%}
html.celu .filterbar .search,html.celu .search{flex:1 1 100%;min-width:0;padding:12px;border-radius:12px}
html.celu .filterbar select,html.celu .tsel{padding:10px;border-radius:10px}
html.celu .btn{padding:11px 14px;font-size:14px;border-radius:12px}
html.celu .btn.sm{padding:8px 11px;font-size:12.5px;border-radius:10px}
html.celu .grid{gap:12px}
html.celu .g2,html.celu .g3{grid-template-columns:1fr}
html.celu .g4,html.celu .gkpi{grid-template-columns:1fr 1fr;gap:10px}
html.celu .gauto{grid-template-columns:1fr}
html.celu .card{border-radius:16px}
html.celu .card-h{padding:13px 15px;flex-wrap:wrap}
html.celu .card-b{padding:14px 15px}
html.celu .stat{padding:13px 14px;min-width:0}
html.celu .stat .k{font-size:10.5px}
html.celu .stat .v{font-size:20px}
html.celu .stat .d{font-size:11.5px}
html.celu .g4>.stat.accent,html.celu .gkpi>.stat.accent{grid-column:1/-1;padding:20px;box-shadow:0 8px 22px rgba(21,164,99,.30)}
html.celu .stat.accent .k{font-size:12px;color:rgba(255,255,255,.88)}
html.celu .stat.accent .v{font-size:34px}
html.celu .stat.accent .d{font-size:12.5px}
html.celu .subnav{display:flex;width:100%;margin:0 0 14px;padding:4px;border-radius:14px;overflow-x:auto}
html.celu .subnav button{flex:1 0 auto;padding:12px 14px;font-size:14.5px;border-radius:11px;white-space:nowrap}
html.celu .subnav button.active{background:var(--teal);color:#fff;box-shadow:0 2px 8px rgba(21,164,99,.35)}
html.celu .params-grid{grid-template-columns:1fr}
html.celu .field input,html.celu .field select{padding:12px}
html.celu .banner{font-size:13.5px;align-items:flex-start}
html.celu .exp-grid{grid-template-columns:1fr 1fr}
/* tablas de consulta -> tarjetas (las de carga quedan como tabla con scroll) */
html.celu .tbl-wrap:has(>table.tc){overflow:visible}
html.celu .card:has(>.tbl-wrap>table.tc),html.celu .card:has(>.card-b>.tbl-wrap>table.tc){background:none;border:0;box-shadow:none}
html.celu .card:has(>.tbl-wrap>table.tc)>.card-h{padding:4px 2px 10px;border:0}
html.celu table.tc,html.celu table.tc>tbody{display:block;width:100%}
html.celu table.tc>thead{display:none}
html.celu table.tc>tbody>tr{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 10px;padding:14px;margin-bottom:10px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(26,38,34,.05)}
html.celu table.tc>tbody>tr>td{display:block;padding:0;border:0!important;text-align:left!important;font-size:14.5px;min-width:0;white-space:normal!important;background:none!important}
html.celu table.tc>tbody>tr>td[data-l]:not([data-l=""])::before{content:attr(data-l);display:block;font-family:'IBM Plex Sans';font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
html.celu table.tc>tbody>tr>td.tit{grid-row:1;grid-column:1/3;font-family:'Archivo';font-size:16.5px;font-weight:700}
html.celu table.tc>tbody>tr>td.tit::before,html.celu table.tc>tbody>tr>td.der::before,html.celu table.tc>tbody>tr>td.acc::before{display:none!important}
html.celu table.tc>tbody>tr>td.der{grid-row:1;grid-column:3;text-align:right!important;font-size:17px;font-weight:700;white-space:nowrap!important}
html.celu table.tc>tbody>tr>td.full{grid-column:1/-1}
html.celu table.tc>tbody>tr>td.acc{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
html.celu table.tc>tbody>tr>td.acc:empty,html.celu table.tc>tbody>tr>td.vacio{display:none}
html.celu table.tc>tbody>tr>td.chk{grid-column:1/-1;order:99;display:flex;align-items:center;gap:10px;padding-top:8px;border-top:1px solid var(--line2)!important;font-size:13px;color:var(--ink2)}
html.celu table.tc>tbody>tr>td.chk::before{display:none!important}
html.celu table.tc>tbody>tr>td.chk::after{content:'Activo'}
html.celu table.tc>tbody>tr>td.chk input{width:22px;height:22px}
html.celu table.tc .tinp,html.celu table.tc .tsel,html.celu table.tc td>input:not([type=checkbox]),html.celu table.tc td>select{width:100%!important;max-width:none!important;padding:10px;border-radius:10px;text-align:left}
html.celu table.tc td.der .tinp,html.celu table.tc td.der>input{text-align:right;font-weight:700}
html.celu table.tc.tc-inp>tbody>tr{grid-template-columns:repeat(2,1fr)}
html.celu table.tc.tc-inp>tbody>tr>td.tit{grid-column:1/-1;grid-row:auto;order:-2}
html.celu table.tc.tc-inp>tbody>tr>td.der{grid-column:1/-1;grid-row:auto;order:-1;text-align:left!important}
html.celu table.tc.tc-inp>tbody>tr>td.der::before{display:block!important}
html.celu table.tc>tbody>tr.row-inact{opacity:.55}
html.celu table.tc>tbody>tr.total{background:var(--teal-l);border-color:var(--teal)}
html.celu table.tc>tbody>tr.fila-rara{display:block;padding:12px 14px}
html.celu table.tc>tbody>tr.fila-rara>td{display:block}
html.celu table.tc>tbody>tr.exp-row{margin-top:-6px;background:var(--teal-l2)}
html.celu .tbl-wrap{-webkit-overflow-scrolling:touch}
html.celu #app{overflow-x:clip}
html.celu .page table:not(.tc){display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
html.celu .card-b{overflow-x:auto}
html.celu .page .section-head input:not(.tinp),html.celu .page .filterbar input:not(.tinp),html.celu .page .card-h input:not(.tinp):not([type=checkbox]){flex:1 1 100%;width:100%;min-width:0;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
html.celu table:not(.tc) th,html.celu table:not(.tc) td{padding:9px 10px}
html.celu .tinp{font-size:15px!important;padding:8px;max-width:104px}
html.celu svg{max-width:100%}
html.celu .c-chartbox{max-height:240px;overflow:hidden}
/* modales a pantalla completa */
html.celu .modal-bg{padding:0;align-items:stretch;backdrop-filter:none}
html.celu .modal,html.celu .modal.wide{max-width:none;max-height:none;height:100vh;height:100dvh;border-radius:0}
html.celu.celu-zoom .modal{height:var(--wfh)}
html.celu .modal-h{padding:14px 16px;background:var(--teal);color:#fff;align-items:center;position:sticky;top:0;z-index:3}
html.celu .modal-h h3{font-size:17px;color:#fff}
html.celu .modal-h .x{background:rgba(255,255,255,.18);color:#fff;width:38px;height:38px;font-size:20px}
html.celu .modal-b{padding:16px}
html.celu .modal-foot{padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}

let S = null;               // estado vivo
const _ph=v=>!v||/^PEGAR_/.test(v);          // placeholder sin reemplazar
let binId = _ph(CONFIG.JSONBIN_BIN_ID)?'':CONFIG.JSONBIN_BIN_ID;
const useCloud = ()=> !_ph(CONFIG.JSONBIN_KEY);
let saveTimer=null;

function deepMerge(base,ovr){ // mantener estructura si el seed creció
  if(Array.isArray(base)) return ovr!=null?ovr:base;
  if(typeof base==='object'&&base){ const o={...base};
    for(const k in base) o[k]=deepMerge(base[k], ovr?ovr[k]:undefined);
    if(ovr) for(const k in ovr) if(!(k in base)) o[k]=ovr[k];
    return o; }
  return ovr!=null?ovr:base;
}

let LOAD_OK=false; // true solo si la lectura de la nube fue OK (o si es modo local); bloquea el guardado en la nube si falló
async function loadState(){
  let data=null; let cloudOK=false;
  if(useCloud()){
    if(!binId){ cloudOK=true; } // primer uso: se permite crear el bin
    else{
      try{
        const r=await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`,{headers:{'X-Master-Key':CONFIG.JSONBIN_KEY}});
        if(r.ok){ const j=await r.json(); data=j.record; cloudOK=true; }
        else { cloudOK=false; }
      }catch(e){ console.warn('JSONBin load fail',e); cloudOK=false; }
    }
  } else { cloudOK=true; }
  LOAD_OK = cloudOK;
  if(!data){ try{ data=JSON.parse(localStorage.getItem(CONFIG.LS_KEY)); }catch(e){} }
  S = data ? deepMerge(JSON.parse(JSON.stringify(SEED)), data) : JSON.parse(JSON.stringify(SEED));
  migrate();
}

/* Migraciones sobre datos ya guardados en la nube (el seed solo no alcanza) */
function migrate(){
  let m = (S.meta && S.meta.migr) || 0, changed=false;
  const M_ACTUAL = 16;
  if(m < M_ACTUAL){
    // foto de los precios ANTES de tocar nada: queda en el historial de listas
    try{
      S.history = S.history || [];
      S.history.unshift({id:Date.now(),date:nowISO(),
        label:`Auto \u00b7 respaldo antes de actualizar la app (v${m} \u2192 v${M_ACTUAL})`,
        snap:priceSnapshot()});
      if(S.history.length>50) S.history.length=50;
    }catch(e){}
  }
  if(m < 1){
    // 1) 'cargas' de bandejas pasa de incremento (0,5) a multiplicador (1,5), igual que el resto
    const bp=S.bandejas.params;
    if(bp.cargas < 1) { bp.cargas = 1 + bp.cargas; }
    // 2) el laminado deja de usar costos congelados de PET y PE
    S.petpe.params.linkPET = true;
    S.petpe.params.linkPE  = true;
    // 3) defaults de empaque por producto si faltan
    S.bandejas.productos.forEach(pr=>{
      if(pr.uCaja==null)        pr.uCaja        = pr.linea==='Ensaladera'?500:600;
    });
    m=1; changed=true;
  }
  if(m < 2){
    // empaque real: se entrega en fábrica (sin traslado), stretch nulo, pallet $6.800,
    // caja = promedio de la cotización Kraft Liner 19/03/2026 (E900 1085,14 / T900 620,82)
    const bp=S.bandejas.params;
    bp.cajaARS=853; bp.palletARS=6800; bp.stretchARS=0; bp.fletePallet=0; bp.pctFlete=0;
    const UP={F40:15500,F41:15500,F43:15500,F50:10000,F61:10000,F63:10000};
    S.bandejas.productos.forEach(pr=>{
      if(pr.uPallet==null && pr.cajasPallet!=null) pr.uPallet=(pr.uCaja||1)*pr.cajasPallet;
      delete pr.cajasPallet;
      if(UP[pr.cod]) pr.uPallet=UP[pr.cod];
      if(pr.uPallet==null) pr.uPallet=10000;
      if(pr.uCaja==null)   pr.uCaja=pr.linea==='Ensaladera'?500:600;
    });
    S.bandejas.ensaladeras.forEach(e=>{ if(e.cajaCli==null) e.cajaCli=/bandex|envases/i.test(e.cli||''); });
    m=2; changed=true;
  }
  if(m < 3){
    const FMT={
      E900:[{u:300,up:10800},{u:500,up:12000},{u:440,up:13200},{u:100,up:7200}],
      E910:[{u:300,up:10800},{u:500,up:12000},{u:440,up:13200},{u:100,up:7200}],
      T900:[{u:300,up:21600},{u:1000,up:24000},{u:100,up:11200}],
      S900:[{u:300,up:10800}],
      F40:[{u:600,up:15500}],F41:[{u:600,up:15500}],F43:[{u:600,up:15500}],
      F50:[{u:600,up:10000}],F61:[{u:600,up:10000}],F63:[{u:600,up:10000}]
    };
    S.bandejas.productos.forEach(pr=>{
      if(FMT[pr.cod]) pr.formatos=FMT[pr.cod];
      else if(!pr.formatos) pr.formatos=[{u:pr.uCaja||500,up:pr.uPallet||10000}];
      delete pr.uCaja; delete pr.uPallet;
    });
    ['F40','F41','F43'].forEach(c=>{ if(S.bandejas.clamshells[c]===39) S.bandejas.clamshells[c]=45; });
    m=3; changed=true;
  }
  if(m < 4){
    // listas de precios vigentes al 28/08/2026 (Excel PET y PET/PE + pantallas de bandejas)
    // NO se pisan precios: lo que esta guardado siempre gana. Solo se completa lo que falta.
    const PET={}; SEED.pet.clientes.forEach(c=>{ PET[c.cli+'|'+c.v]=c; });
    S.pet.clientes.forEach(c=>{ const n=PET[c.cli+'|'+c.v];
      if(n){ if(c.act==null) c.act=n.act;
             if(c.activo==null) c.activo=n.activo;
             if(!c.nota) c.nota=n.nota; } });
    SEED.pet.clientes.forEach(n=>{ if(!S.pet.clientes.some(c=>c.cli===n.cli && c.v===n.v)) S.pet.clientes.push({...n}); });
    S.pet.clientes.forEach(c=>{ if(c.activo==null) c.activo=true; });

    const PP={}; SEED.petpe.productos.forEach(p=>{ PP[p.cli+'|'+p.med]=p; });
    S.petpe.productos.forEach(p=>{ const n=PP[p.cli+'|'+p.med];
      if(n && p.precio==null) p.precio=n.precio; });
    SEED.petpe.productos.forEach(n=>{ if(!S.petpe.productos.some(p=>p.cli===n.cli && p.med===n.med)) S.petpe.productos.push({...n}); });

    if(S.bandejas.clamshells.F61===80) S.bandejas.clamshells.F61=88;
    if(S.bandejas.clamshells.F63===75) S.bandejas.clamshells.F63=80;
    const ENS={Bandex:{E900:60,T900:41,S900:41,E910:65},
      Nitopi:{E900:88856,T900:62200,S900:62200,E910:98856},
      'Winflex (directo)':{E900:120094,T900:84065,S900:84065,E910:126097},
      'Envases FS / Group':{E900:112121,T900:76950,S900:76950,E910:115420}};
    // solo completa los que falten; nunca pisa un precio ya cargado
    S.bandejas.ensaladeras.forEach(e=>{ const n=ENS[e.cli]; if(!n) return;
      Object.keys(n).forEach(k=>{ if(e.p[k]==null) e.p[k]=n[k]; }); });
    m=4; changed=true;
  }
  if(m < 5){
    // el estado del precio pasa a ser dato estructurado: fecha (AAAA-MM) + tipo
    const parse=(txt)=>{
      const t=String(txt||'').toLowerCase();
      let tipo=/no compra/.test(t)?'sin mov.':/cotiz/.test(t)?'cotizado':/fact/.test(t)?'facturado':/lista/.test(t)?'lista':null;
      let ult=null;
      let m1=/(\d{2})[\/](\d{4})/.exec(t);                       // 08/2026
      if(m1) ult=m1[2]+'-'+m1[1];
      else { const m2=/(\d{2})[\/](\d{2})[\/](\d{2})\b/.exec(t); // 27/08/26
             if(m2) ult='20'+m2[3]+'-'+m2[2]; }
      return {tipo,ult};
    };
    S.pet.clientes.forEach(c=>{ const p=parse(c.nota); if(c.ult==null) c.ult=p.ult; if(c.tipo==null) c.tipo=p.tipo; });
    if(!S.pet.sem)   S.pet.sem={v:0.30,a:0.15};
    if(!S.petpe.sem) S.petpe.sem={v:0.30,a:0.15};
    m=5; changed=true;
  }
  if(m < 6){
    // Ganancias sale del margen: es reparto del resultado, no costo de la operacion
    if(!S.cfg) S.cfg={};
    if(S.cfg.ganEnMargen==null) S.cfg.ganEnMargen=false;
    m=6; changed=true;
  }
  if(m < 7){
    // el precio anterior deja de ser un campo suelto y pasa a ser una serie con fecha
    const seed=(o,keyAct)=>{
      if(o.ant!=null && isFinite(o.ant) && o.ant!==0 && +o.ant!==+o[keyAct]){
        o.hist=o.hist&&o.hist.length?o.hist:[{p:+o.ant,d:null}];
      } else { o.hist=o.hist||[]; }
    };
    S.pet.clientes.forEach(c=>seed(c,'act'));
    S.petpe.productos.forEach(p=>seed(p,'precio'));
    m=7; changed=true;
  }
  if(m < 8){
    // v4 duplico filas de laminado al renombrar medidas (Molinos "421x300" -> "421x300 (300MC)")
    const norm=x=>String(x||'').replace(/\([^)]*\)/g,'').replace(/\s+/g,'').toUpperCase();
    const vistos={}, out=[];
    S.petpe.productos.forEach(p=>{
      const k=norm(p.cli)+'|'+norm(p.med), prev=vistos[k];
      if(prev===undefined){ vistos[k]=out.length; out.push(p); return; }
      const q=out[prev];
      // se queda la fila con la etiqueta mas descriptiva y se rescata el historial de la otra
      const mejor = (p.med||'').length>(q.med||'').length ? p : q;
      const otro  = mejor===p ? q : p;
      mejor.hist = (mejor.hist&&mejor.hist.length) ? mejor.hist : (otro.hist||[]);
      if(mejor.ant==null && otro.ant!=null){ mejor.ant=otro.ant; mejor.antD=otro.antD; }
      // si la otra fila fue editada a mano (tiene historial o fecha de cambio), su precio manda
      const editada = (otro.hist&&otro.hist.length) || otro.antD;
      if(editada && otro.precio!=null) mejor.precio=otro.precio;
      if(mejor.activo==null && otro.activo!=null) mejor.activo=otro.activo;
      out[prev]=mejor;
    });
    S.petpe.productos=out;
    S.petpe.productos.forEach(p=>{ if(p.activo==null) p.activo=true; });
    S.bandejas.ensaladeras.forEach(e=>{ if(e.activo==null) e.activo=true; });
    if(!S.cfg) S.cfg={};
    if(S.cfg.verInactivos==null) S.cfg.verInactivos=false;
    m=8; changed=true;
  }
  if(m < 9){
    // el laminado se costeaba SIEMPRE con PET cristal, aunque el producto fuera de color
    S.petpe.productos.forEach(p=>{
      if(p.v!=null) return;
      p.v = /negro|black/i.test(p.cli+' '+p.med) ? 2
          : /blanco|white/i.test(p.cli+' '+p.med) ? 1
          : /azul/i.test(p.cli+' '+p.med) ? 3 : 0;
    });
    m=9; changed=true;
  }
  if(m < 10){
    // una sola estructura de gastos y un solo semaforo
    S.net = S.net || (S.pet && S.pet.net) || {admin:.02,iibb:.035,dyc:.015,financiero:.03,ganancias:.35};
    // umbrales recalibrados: al sacar Ganancias el margen subio ~1/0,65
    S.sem = S.sem || {v:0.45,a:0.25};
    delete S.pet.net; delete S.petpe.net; delete S.bandejas.net;
    delete S.pet.sem; delete S.petpe.sem;
    if(S.bandejas.params){ delete S.bandejas.params.semVerde; delete S.bandejas.params.semAmarillo; }
    // lamina propia en termoformado, valuada como en laminado
    if(S.bandejas.params.linkPET==null) S.bandejas.params.linkPET=true;
    S.bandejas.productos.forEach(pr=>{ if(pr.v==null) pr.v = pr.mat==='Negro'?2:0; });
    if(S.tc.usarLista==null) S.tc.usarLista=false;
    m=10; changed=true;
  }
  if(m < 11){
    // el pallet de lamina lleva 800 kg, no 500: cambia el prorrateo del traslado y del pallet
    if(S.pet.params.palletCap===500) S.pet.params.palletCap=800;
    m=11; changed=true;
  }
  if(m < 12){
    if(!S.papelera) S.papelera=[];
    // SILMAG (PET Virgen Azulino) se perdio al depurar duplicados: se repone si falta
    const hay=S.pet.clientes.some(c=>/silmag/i.test(c.cli));
    if(!hay) S.pet.clientes.push({cli:"SILMAG",v:6,ant:7.43,act:7.43,activo:false,
      nota:"no compra desde 11/2025",ult:"2025-11",tipo:"sin mov.",hist:[]});
    m=12; changed=true;
  }
  if(m < 13){
    // el formato de caja pasa a ser por canal Y producto
    S.bandejas.ensaladeras.forEach(e=>{
      const viejo=(typeof e.fmt==='number')?e.fmt:null, o={};
      Object.keys(e.p||{}).forEach(cod=>{
        const pr=S.bandejas.productos.find(x=>x.cod===cod);
        const dispo=((pr&&pr.formatos)||[]).map(f=>+f.u);
        o[cod]=(viejo!=null&&dispo.includes(+viejo))?+viejo:(dispo[0]!=null?dispo[0]:300);
      });
      e.fmt=o;
    });
    m=13; changed=true;
  }
  if(m < 15){
    // el scrap recuperado de termoformado deja de valuarse al precio de lamina: vuelve como rPET a 1 USD/kg
    if(S.bandejas.params.scrapUSD==null) S.bandejas.params.scrapUSD=1.00;
    m=15; changed=true;
  }
  if(m < 14){
    // Semaforo por linea, calibrado con el flujo de fondos E41 (jul-25/jun-26):
    // margen operativo modelo ~35% vs ganancia real 12,8% => 22 pts de estructura + desvio del modelo.
    // rojo < 22 (no cubre estructura) · amarillo 22-34 · verde >= 34 (12%+ real)
    S.sem={ pet:{v:0.34,a:0.22}, petpe:{v:0.34,a:0.22}, bandejas:{v:0.34,a:0.22} };
    if(!S.cfg) S.cfg={};
    m=14; changed=true;
  }
  if(m < 16){
    // criterio sep-2026: Ganancias (35%) es solo informativo, nunca se descuenta del margen en ninguna linea
    if(!S.cfg) S.cfg={};
    S.cfg.ganEnMargen=false;
    m=16; changed=true;
  }
  if(changed){ S.meta.migr=m; scheduleSave(); }
}

/* ============================================================
   CALC ENGINES  (replican las fórmulas de los Excel)
   ============================================================ */

/* Ganancias dentro del margen? Por defecto NO: es reparto del resultado, no costo. */
function GAN_EN_MARGEN(){ return !!(S && S.cfg && S.cfg.ganEnMargen); }

/* ---- FILM PE ---- */
/* Criterio sep-2026: el PE se costea con el material MAS CARO de los que entran al costeo.
   En modo 'max' la receta se arma sola: 100% del insumo activo de mayor USD/kg. */
function peMaxIns(){ let b=null;
  S.pe.insumos.forEach(i=>{ if(i.activo===false) return; if(!b||(+i.usd||0)>(+b.usd||0)) b=i; });
  return b; }
function peSyncReceta(){
  if(S.pe.params.mpCriterio==='receta') return;
  const b=peMaxIns(); if(!b) return;
  const r=S.pe.receta;
  if(r.length===1&&r[0].cod===b.cod&&r[0].p===1) return;
  S.pe.receta=[{cod:b.cod,p:1}];
}
function calcPE(){
  peSyncReceta();
  const p=S.pe.params, tc=TC();
  const energia=(p.motores*p.consumoMotor*p.usdkwh)/p.prodHora;
  const MO=(p.valorHora*p.operarios*p.cargas)/p.prodHora/tc;
  const proc=energia+MO+p.otrosVarios+p.otrosIndirectos;
  const idx={}; S.pe.insumos.forEach(i=>idx[i.cod]=i.usd);
  let mpBase=0; S.pe.receta.forEach(r=>mpBase+=r.p*(idx[r.cod]||0));
  const factor=1/(1-p.merma);
  const mpAjust=mpBase*factor;
  const total=mpAjust+proc;
  return {energia,MO,otros:p.otrosVarios,indirectos:p.otrosIndirectos,proc,
    mpBase,factor,mpAjust,total,totalARS:total*tc};
}

/* ---- PET LÁMINA ---- */
function petProc(){
  const p=S.pet.params, tc=TC();
  const energia=p.energia;
  const MO=(p.valorHora*p.operarios*p.cargas)/p.prodHora/tc;
  const cono=((p.conoARSkg*p.conoKgBobina)/p.kgBobinaProd)/tc;
  const pallet=(p.palletARS/p.palletCap)/tc;
  const stretch=(cono+pallet)*p.stretchPct;
  const flete=(p.fletePallet*p.pctFlete/p.palletCap)/tc;
  const otros=p.otrosVarios, indirectos=p.otrosIndirectos;
  const totalCFlete=energia+MO+cono+pallet+stretch+flete+otros+indirectos;
  return {energia,MO,cono,pallet,stretch,flete,otros,indirectos,totalCFlete,totalSFlete:totalCFlete-flete};
}
function petVariantes(){
  const p=S.pet.params, proc=petProc(), tc=TC();
  const u=S.pet.insumos.map(i=>i.usd);
  const factor=1/(1-(p.merma-p.recuperacion));
  return S.pet.variantes.map(v=>{
    let mpBase=0; v.r.forEach((x,i)=>mpBase+=x*(u[i]||0));
    const mpAjust=mpBase*factor;
    return {nom:v.nom,mpBase,mpAjust,procC:proc.totalCFlete,procS:proc.totalSFlete,
      cFlete:mpAjust+proc.totalCFlete, sFlete:mpAjust+proc.totalSFlete, arsC:(mpAjust+proc.totalCFlete)*tc};
  });
}
function petClientRow(c,variantes){
  // c.activo===false -> cliente que dejo de comprar; se muestra pero no entra en promedios
  const n=NET(), vr=variantes[c.v]||variantes[0];
  const costo=vr.cFlete, precio=c.act;
  const bruta=precio-costo, margenBruto=precio?bruta/precio:0;
  const gastos=precio*(n.admin+n.iibb+n.dyc+n.financiero);
  const opUSD=precio-costo-gastos;                       // margen OPERATIVO (antes de Ganancias)
  const gan=Math.max(0,opUSD*n.ganancias);               // se informa, no se descuenta
  const netoUSD=opUSD-(GAN_EN_MARGEN()?gan:0), margenNeto=precio?netoUSD/precio:0;
  const margenOp=precio?opUSD/precio:0;
  const aumento=c.ant?(c.act-c.ant)/c.ant:0;
  return {...c,activo:c.activo!==false,variante:vr.nom,costo,precio,bruta,margenBruto,gastos,opUSD,margenOp,gan,netoUSD,margenNeto,aumento};
}

/* ---- LAMINADO PET/PE ---- */
function petpeProc(){
  const p=S.petpe.params, tc=TC();
  const adhes=S.petpe.adhesivos.reduce((a,x)=>a+x.usd*x.pct,0);
  const MOlam=(p.salLam*p.opLam*p.cargasLam)/p.prodLam/tc;
  const enerLam=(p.motoresLam*p.consumoLam*p.usdkwhLam)/p.prodLam;
  const subLam=adhes+MOlam+enerLam;
  const MOref=(p.salRef*p.opRef*p.cargasRef)/p.prodRef/tc;
  const enerRef=(p.motoresRef*p.consumoRef*p.usdkwhRef)/p.prodRef;
  const subRef=MOref+enerRef+p.otrosRef;
  return {adhes,MOlam,enerLam,subLam,MOref,enerRef,otrosRef:p.otrosRef,subRef,procKg:subLam+subRef};
}
/* La lamina que consumen Laminado y Termoformado es la NUESTRA, y para llegar a Lanus
   paga el traslado desde Chivilcoy. Por eso se valua CON ese costo incluido. */
function petpeCostPET(vIdx){ const p=S.petpe.params;
  if(p.linkPET){ const vs=petVariantes(); const v=vs[vIdx!=null?vIdx:0]||vs[0]; return v.cFlete; }
  return p.costoLaminaPET; }
function petpeCostPE(){ const p=S.petpe.params; if(p.linkPE){ return calcPE().total; } return p.costoLaminaPE; }
function petpeRow(pr){
  const p=S.petpe.params, n=NET(), proc=petpeProc(), tc=TC();
  const cPETkg=petpeCostPET(pr.v), cPEkg=petpeCostPE();
  const vPET=(petVariantes()[pr.v!=null?pr.v:0]||petVariantes()[0]).nom;
  const yPET=(pr.aFin*pr.tiras)/pr.aPET, yPE=(pr.aFin*pr.tiras)/pr.aPE;
  const gPET=pr.ePET*p.densPET, gPE=pr.ePE*p.densPE, gTot=gPET+gPE;
  const pPET=gPET/gTot, pPE=gPE/gTot;
  const kgPET=pPET/yPET, kgPE=pPE/yPE, kgTot=kgPET+kgPE;
  const cPET=kgPET*cPETkg, cPE=kgPE*cPEkg, cProc=kgTot*proc.procKg;
  const costo=cPET+cPE+cProc, precio=pr.precio;
  const margenBruto=precio?(precio-costo)/precio:0;
  const gastos=precio*(n.admin+n.iibb+n.dyc+n.financiero);
  const preGan=precio-costo-gastos;                      // margen OPERATIVO
  const gan=Math.max(0,preGan*n.ganancias);              // se informa, no se descuenta
  const netoUSD=preGan-(GAN_EN_MARGEN()?gan:0), margenNeto=precio?netoUSD/precio:0;
  const margenOp=precio?preGan/precio:0;
  const aumento=pr.ant?(precio-pr.ant)/pr.ant:0;
  return {...pr,vPET,cPETkg,yPET,yPE,gPET,gPE,pPET,pPE,kgPET,kgPE,kgTot,cPET,cPE,cProc,costo,
    margenBruto,gastos,preGan,margenOp,gan,netoUSD,margenNeto,aumento};
}

/* ---- BANDEJAS ---- */
/* la lamina que entra a la termoformadora es propia: se valua igual que en laminado */
function baPrecioLamina(prod){
  const p=S.bandejas.params;
  if(p.linkPET!==false){ const vs=petVariantes();
    return (vs[prod.v!=null?prod.v:(prod.mat==='Negro'?2:0)]||vs[0]).cFlete; }
  return prod.mat==='Negro'?p.mpNegro:p.mpCristal;
}
function baVarNom(prod){
  if(S.bandejas.params.linkPET===false) return prod.mat;
  const vs=petVariantes();
  return (vs[prod.v!=null?prod.v:(prod.mat==='Negro'?2:0)]||vs[0]).nom;
}
/* formato que usa un canal para UN producto: e.fmt es {cod: unidadesPorCaja} */
/* empaque cargado a mano para ese canal y producto (USD/millar), o null si se calcula */
function baEmpDe(e,cod){
  const v = e && e.emp && e.emp[cod];
  return (v!=null && isFinite(v) && v!=='') ? +v : null;
}
/* el numero que se muestra: el manual si existe, si no el que sale del formato */
function baEmpUSD(e,cod){
  const man=baEmpDe(e,cod); if(man!=null) return {usd:man,manual:true};
  const pr=S.bandejas.productos.find(x=>x.cod===cod); if(!pr) return {usd:0,manual:false};
  return {usd:bandejaCost(pr,e&&e.cajaCli,baFmtDe(e,cod)).cEmpaque*1000,manual:false};
}
function baFmtDe(e,cod){
  if(e && e.fmt && typeof e.fmt==='object') return e.fmt[cod];
  if(e && typeof e.fmt==='number') return e.fmt;   // dato viejo: un solo formato para todo
  return null;
}
function baFormato(prod,fmtU){
  const F=(prod.formatos&&prod.formatos.length)?prod.formatos:[{u:prod.uCaja||1,up:prod.uPallet||1}];
  return (fmtU!=null && F.find(x=>+x.u===+fmtU)) || F[0];
}
function bandejaCost(prod,sinCaja,fmtU,empU){
  const p=S.bandejas.params, tc=TC();
  const MOh=p.salario*p.operarios*p.cargas;          // cargas = MULTIPLICADOR (igual que PE/PET/Laminado)
  const desp=prod.bruto-prod.neto;
  const mpUtil=(prod.neto+desp*(1-p.recuperacion))/1000;
  const precioMP=baPrecioLamina(prod);
  // scrap recuperado: se compra lamina por el bruto y se recupera desp×recup a valor scrap (rPET), no a precio de lamina
  const kgRecup=desp*p.recuperacion/1000, cScrap=kgRecup*(precioMP-(p.scrapUSD||0));
  const cMP=mpUtil*precioMP+cScrap, cMO=(MOh/prod.vel)/tc, cEner=mpUtil*p.energia, cOtros=mpUtil*prod.otros;
  // --- empaque: formato de caja + quien la pone (depende del CANAL) ---
  const F=baFormato(prod,fmtU), uCaja=F.u||1, uPall=F.up||1;
  const cCaja=sinCaja?0:(p.cajaARS/uCaja)/tc;
  const cPallet=((p.palletARS+p.stretchARS)/uPall)/tc;
  const cFlete=((p.fletePallet*p.pctFlete)/uPall)/tc;
  // empU: costo de empaque cargado a mano, en USD por millar. Si esta, manda.
  const manual = (empU!=null && isFinite(empU));
  const cEmpaque = manual ? empU/1000 : (cCaja+cPallet+cFlete);
  const totalU=cMP+cMO+cEner+cOtros+cEmpaque;
  return {desp,mpUtil,kgRecup,cScrap,precioMP,uCaja,uPall,sinCaja,empManual:manual,cMP,cMO,cEner,cOtros,cCaja,cPallet,cFlete,cEmpaque,totalU,usdMillar:totalU*1000};
}
/* margen de bandejas en la MISMA base que PET y Laminado */
function baMargen(precio,costo){
  const n=NET()||{admin:0,iibb:0,dyc:0,financiero:0,ganancias:0};
  const margenBruto=precio?(precio-costo)/precio:0;
  const gastos=precio*(n.admin+n.iibb+n.dyc+n.financiero);
  const preGan=precio-costo-gastos;                      // margen OPERATIVO
  const gan=Math.max(0,preGan*n.ganancias);              // se informa, no se descuenta
  const netoUSD=preGan-(GAN_EN_MARGEN()?gan:0);
  return {margenBruto,gastos,preGan,margenOp:precio?preGan/precio:0,gan,netoUSD,
          margenNeto:precio?netoUSD/precio:0};
}
function bandejaCostByCod(cod,sinCaja,fmtU,empU){ const pr=S.bandejas.productos.find(x=>x.cod===cod); return pr?bandejaCost(pr,sinCaja,fmtU,empU).usdMillar:0; }

/* ============================================================
   UX v2 — vista por cliente, pricing por margen objetivo,
   armador de listas con vista previa, deshacer, pegar desde Excel
   ============================================================ */

/* ---- normalizacion de nombres para cruzar modulos ---- */
function cliKey(n){
  return String(n||'').toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\bGRAF\b|\bGRAFICA\b|\bGRAFICAS\b/g,'GRAF')
    .replace(/\([^)]*\)/g,' ')
    .replace(/[^A-Z0-9 ]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function mergeKey(k,keys){
  for(const o of keys){ if(o!==k && o.length>=5 && (k.startsWith(o+' ')||k===o)) return o; }
  return k;
}

/* ---- inversa del margen: que precio hace falta para un margen operativo dado ---- */
function precioParaMargen(costo,margen,net){
  const G=net.admin+net.iibb+net.dyc+net.financiero, g=GAN_EN_MARGEN()?net.ganancias:0;
  const den=(1-G)*(1-g)-margen;
  if(den<=0.0001) return null;               // margen inalcanzable con esta estructura
  return costo*(1-g)/den;
}
/* ---- precio piso: margen operativo = 0 ---- */
function precioPiso(costo,net){
  const G=net.admin+net.iibb+net.dyc+net.financiero;
  return costo/(1-G);   // precio con margen operativo cero
}

/* ---- estado del precio (antiguedad) ---- */
function mesesDesde(ym){
  if(!ym) return null;
  const m=/(\d{4})-(\d{2})/.exec(ym); if(!m) return null;
  const d=new Date(+m[1],+m[2]-1,1), h=new Date();
  return (h.getFullYear()-d.getFullYear())*12+(h.getMonth()-d.getMonth());
}
function estadoChip(it){
  const n=mesesDesde(it.ult);
  if(it.activo===false) return '<span class="pill r" title="sin movimiento">inactivo</span>';
  if(n==null) return '<span class="tag">sin fecha</span>';
  if(n<=2) return `<span class="pill v">${it.tipo||'mov.'} · ${n===0?'este mes':n+'m'}</span>`;
  if(n<=6) return `<span class="pill a">${it.tipo||'mov.'} · ${n}m</span>`;
  return `<span class="pill r" title="precio viejo">${it.tipo||'mov.'} · ${n}m</span>`;
}

/* ---- precio anterior: texto, no input. Con fecha y acceso a la serie ---- */
function celdaAnterior(r,mod,i,dec){

  if(r.ant==null||!isFinite(r.ant)||r.ant===0)

}

function clientesData(){
  const vr=petVariantes(), map={};
  const push=(nom,it)=>{ const k=cliKey(nom); (map[k]=map[k]||{nom,items:[]}).items.push(it); };

  S.pet.clientes.forEach(c=>{ const r=petClientRow(c,vr);
    push(c.cli,{mod:'PET Lámina',tag:'blue',det:r.variante,unidad:'USD/kg',
      precio:r.precio,costo:r.costo,margen:r.margenNeto,activo:c.activo!==false,
      ult:c.ult,tipo:c.tipo,ref:{t:'pet',i:S.pet.clientes.indexOf(c)}}); });

  S.petpe.productos.forEach(p=>{ if(!verInact() && !esActivo(p)) return; const r=petpeRow(p);
    push(p.cli,{mod:'Laminado',tag:'teal',det:p.med,unidad:'USD/kg',
      precio:r.precio,costo:r.costo,margen:r.margenNeto,activo:esActivo(p),
      ult:p.ult,tipo:p.tipo,revisar:!!p.revisar,ref:{t:'petpe',i:S.petpe.productos.indexOf(p)}}); });

  S.bandejas.ensaladeras.forEach(e=>{ if(!verInact() && !esActivo(e)) return; Object.entries(e.p).forEach(([cod,val])=>{
    if(val==null) return;
    const precio=e.mon==='USD'?val:val/TC(), costo=bandejaCostByCod(cod,e.cajaCli,baFmtDe(e,cod),baEmpDe(e,cod));
    push(e.cli,{mod:'Ensaladeras',tag:'green',det:cod+(e.cajaCli?' · s/caja':''),unidad:'USD/millar',
      precio,costo,margen:baMargen(precio,costo).margenNeto,activo:esActivo(e),
      ref:{t:'bandejas',i:S.bandejas.ensaladeras.indexOf(e)}}); }); });

  // fusionar claves que son prefijo de otras (HUERTAS / HUERTAS DEL PILAR)
  const keys=Object.keys(map), out={};
  keys.forEach(k=>{ const mk=mergeKey(k,keys);
    if(!out[mk]) out[mk]={nom:map[mk]?map[mk].nom:map[k].nom,items:[]};
    out[mk].items=out[mk].items.concat(map[k].items); });

  return Object.values(out).map(c=>{
    const act=c.items.filter(i=>i.activo);
    const base=act.length?act:c.items;
    const avg=base.reduce((a,i)=>a+i.margen,0)/(base.length||1);
    const peor=base.reduce((m,i)=>i.margen<m.margen?i:m,base[0]||{margen:0});
    const mods=[...new Set(c.items.map(i=>i.mod))];
    const meses=c.items.map(i=>mesesDesde(i.ult)).filter(x=>x!=null);
    return {...c,n:c.items.length,nAct:act.length,avg,peor,mods,
      antig:meses.length?Math.max(...meses):null};
  }).sort((a,b)=>a.avg-b.avg);
}

function listaFilas(mod){
  if(mod==='pet'){ const vr=petVariantes();
    return S.pet.clientes.map((c,i)=>{ const r=petClientRow(c,vr);
      return {i,nom:c.cli,det:r.variante,precio:r.precio,costo:r.costo,margen:r.margenNeto,
        activo:c.activo!==false,dec:3,net:NET(),set:v=>priceCommit(S.pet.clientes[i],'act',v)}; }); }
  if(mod==='petpe'){
    return S.petpe.productos.map((p,i)=>{ const r=petpeRow(p);
      return {i,nom:p.cli,det:p.med,precio:r.precio,costo:r.costo,margen:r.margenNeto,
        activo:esActivo(p),dec:3,net:NET(),set:v=>priceCommit(S.petpe.productos[i],'precio',v)}; }); }
  if(mod==='bandejas'){ const out=[];
    S.bandejas.ensaladeras.forEach((e,ei)=>{ Object.keys(e.p).forEach(cod=>{
      const precio=e.mon==='USD'?e.p[cod]:e.p[cod]/TC(), costo=bandejaCostByCod(cod,e.cajaCli,baFmtDe(e,cod),baEmpDe(e,cod));
      out.push({i:ei+'|'+cod,nom:e.cli,det:cod,precio,costo,margen:baMargen(precio,costo).margenNeto,
        activo:esActivo(e),dec:2,net:NET(),
        set:v=>{ S.bandejas.ensaladeras[ei].p[cod]= e.mon==='USD'? v : Math.round(v*TC()); }}); }); });
    Object.keys(S.bandejas.clamshells).forEach(cod=>{
      const precio=S.bandejas.clamshells[cod], costo=bandejaCostByCod(cod);
      out.push({i:'cl|'+cod,nom:'Lista clamshells',det:cod,precio,costo,margen:baMargen(precio,costo).margenNeto,
        activo:true,dec:2,net:NET(),set:v=>{ S.bandejas.clamshells[cod]=Math.round(v*100)/100; }}); });
    return out; }
  return [];
}

let armador={mod:'pet',objetivo:25,topeMax:10,soloBajo:true,umbral:20,redondeo:0.01,noBajar:true};
function armadorCalc(){
  const a=armador, rows=listaFilas(a.mod);
  return rows.map(r=>{
    let nuevo=r.precio, motivo='sin cambio';
    if(!r.activo){ motivo='inactivo'; return {...r,nuevo,motivo,delta:0,margenNuevo:r.margen}; }
    if(a.soloBajo && r.margen*100 >= a.umbral){ motivo=`ya está sobre ${a.umbral}%`; return {...r,nuevo,motivo,delta:0,margenNuevo:r.margen}; }
    const ideal=precioParaMargen(r.costo,a.objetivo/100,r.net);
    if(ideal==null){ motivo='objetivo inalcanzable'; return {...r,nuevo,motivo,delta:0,margenNuevo:r.margen}; }
    nuevo=ideal; motivo=`a ${a.objetivo}% de margen`;
    const tope=r.precio*(1+a.topeMax/100);
    if(nuevo>tope){ nuevo=tope; motivo=`limitado por el tope de +${a.topeMax}%`; }
    if(a.noBajar && nuevo<r.precio){ nuevo=r.precio; motivo='no se baja'; }
    if(a.redondeo>0) nuevo=Math.round(nuevo/a.redondeo)*a.redondeo;
    const mn=(function(){ const n=r.net,G=n.admin+n.iibb+n.dyc+n.financiero;
      const g=nuevo*G, pre=nuevo-r.costo-g, gan=GAN_EN_MARGEN()?Math.max(0,pre*n.ganancias):0;
      return nuevo?(pre-gan)/nuevo:0; })();
    return {...r,nuevo,motivo,delta:r.precio?(nuevo-r.precio)/r.precio:0,margenNuevo:mn};
  });
}

      </tbody></table></div>`;

function dupGrupos(){
  const cls=S.pet.clientes, vr=petVariantes();
  const keys=[...new Set(cls.map(c=>cliKey(c.cli)))];
  const canon={}; keys.forEach(k=>canon[k]=mergeKey(k,keys));
  // A) misma persona + misma variante = fila repetida
  const porFila={};
  cls.forEach((c,i)=>{ const k=canon[cliKey(c.cli)]+'|'+c.v; (porFila[k]=porFila[k]||[]).push(i); });
  const filas=Object.entries(porFila).filter(([,ix])=>ix.length>1)
    .map(([k,ix])=>({k,ix,variante:(vr[cls[ix[0]].v]||{}).nom||''}));
  // B) mismo cliente escrito de varias formas
  const porNom={};
  cls.forEach((c,i)=>{ const k=canon[cliKey(c.cli)]; (porNom[k]=porNom[k]||new Set()).add(c.cli); });
  const nombres=Object.entries(porNom).filter(([,set])=>set.size>1)
    .map(([k,set])=>({k,variantes:[...set],ix:cls.map((c,i)=>canon[cliKey(c.cli)]===k?i:-1).filter(i=>i>=0)}));
  return {filas,nombres};
}

function fmtFecha(d){ if(!d) return 'sin fecha'; const m=/(\d{4})-(\d{2})-(\d{2})/.exec(d); return m?`${m[3]}/${m[2]}/${m[1].slice(2)}`:d; }

/* Un cambio de precio se REGISTRA: archiva el valor viejo con su fecha y arma la serie.
   Es el unico camino por el que un precio deberia cambiar. */
function priceCommit(o,key,nuevo){
  const viejo=o[key]; nuevo=+nuevo;
  if(viejo==null||!isFinite(+viejo)||Math.abs(+viejo-nuevo)<1e-9){ o[key]=nuevo; return false; }
  o.hist=o.hist||[];
  o.hist.unshift({p:+viejo,d:hoyISO()});
  if(o.hist.length>12) o.hist.length=12;
  o.ant=+viejo; o.antD=hoyISO(); o[key]=nuevo;
  return true;
}
/* rutas de precio: se desvian por priceCommit para que el "anterior" nunca quede desfasado */
const _PRECIO=[[/^pet\.clientes\.(\d+)\.act$/,'pet'],[/^petpe\.productos\.(\d+)\.precio$/,'petpe']];
function setPath(p,val){ const ks=p.split('.'); let o=S;
  for(const [rx,mod] of _PRECIO){ const m=rx.exec(p);
    if(m){ const arr = mod==='pet'?S.pet.clientes:S.petpe.productos;
      if(priceCommit(arr[+m[1]],ks[ks.length-1],val)) toast('Precio actualizado · el anterior queda registrado','ok');
      return; } }
  const _k=ks[ks.length-1], _r=_RANGO[_k];
  if(_r && typeof val==='number' && (val<_r[0]||val>_r[1])){
    toast(_k+' fuera de rango ('+_r[0]+'-'+_r[1]+'): se ignora','err'); return; }
  for(let i=0;i<ks.length-1;i++){ const k=/^\d+$/.test(ks[i])?+ks[i]:ks[i]; o=o[k]; }
  const last=ks[ks.length-1]; o[/^\d+$/.test(last)?+last:last]=val; }

function field(path,val,label,{type='num',unit='',sub='',step='any',options=null}={}){
  let input;
  if(options){ input=`<select data-path="${path}">${options.map(o=>`<option value="${o.v}" ${o.v==val?'selected':''}>${o.t}</option>`).join('')}</select>`; }
  else input=`<input type="number" step="${step}" data-path="${path}" data-type="${type}" value="${val}">`;
  return `<div class="field"><label>${label}${sub?`<small>${sub}</small>`:''}</label>
    <div class="iw">${input}${unit?`<span class="unit">${unit}</span>`:''}</div></div>`;
}
function breakdownBar(parts){ // parts: [{label,val,color}]
  const tot=parts.reduce((a,p)=>a+Math.max(0,p.val),0)||1;
  const bars=parts.map(p=>`<span style="width:${Math.max(0,p.val)/tot*100}%;background:${p.color}"></span>`).join('');
  const leg=parts.map(p=>`<span><i style="background:${p.color}"></i>${p.label} <b class="mono">${pct(p.val/tot,0)}</b></span>`).join('');
  return `<div class="bd">${bars}</div><div class="bd-leg">${leg}</div>`;
}

function moduleSummary(){
  const vr=petVariantes();
  const petC=S.pet.clientes.filter(c=>c.activo!==false).map(c=>petClientRow(c,vr));
  const petAvg=petC.reduce((a,c)=>a+c.margenNeto,0)/(petC.length||1);
  const petMin=petC.reduce((m,c)=>c.margenNeto<m.margenNeto?c:m,petC[0]||{margenNeto:0});
  const petMax=petC.reduce((m,c)=>c.margenNeto>m.margenNeto?c:m,petC[0]||{margenNeto:0});

  const ppRows=S.petpe.productos.filter(esActivo).map(petpeRow);
  const ppAvg=ppRows.reduce((a,r)=>a+r.margenNeto,0)/(ppRows.length||1);
  const ppMin=ppRows.reduce((m,r)=>r.margenNeto<m.margenNeto?r:m,ppRows[0]||{margenNeto:0});
  const ppMax=ppRows.reduce((m,r)=>r.margenNeto>m.margenNeto?r:m,ppRows[0]||{margenNeto:0});

  const peTot=calcPE().total;

  // bandejas: margen bruto sobre precio
  const bp=S.bandejas.params; const bRows=[];
  S.bandejas.ensaladeras.forEach(e=>{ Object.entries(e.p).forEach(([cod,val])=>{
    if(!esActivo(e)) return;
    const precio=e.mon==='USD'?val:val/TC(); const costo=bandejaCostByCod(cod,e.cajaCli,baFmtDe(e,cod),baEmpDe(e,cod)); const mm=baMargen(precio,costo);
    bRows.push({cli:e.cli,cod,precio,costo,mb:mm.margenBruto,m:mm.margenNeto}); }); });
  Object.entries(S.bandejas.clamshells).forEach(([cod,val])=>{ const costo=bandejaCostByCod(cod); const mm=baMargen(val,costo);
    bRows.push({cli:'Lista clamshells',cod,precio:val,costo,mb:mm.margenBruto,m:mm.margenNeto}); });
  const bAvg=bRows.reduce((a,r)=>a+r.m,0)/(bRows.length||1);
  const bMin=bRows.reduce((m,r)=>r.m<m.m?r:m,bRows[0]||{m:0});
  const bMax=bRows.reduce((m,r)=>r.m>m.m?r:m,bRows[0]||{m:0});

  const dist=(rows,acc,sg=0.30,sa=0.15)=>{ let g=0,y=0,r=0; rows.forEach(x=>{const s=semaforo(acc(x),sg,sa); if(s==='v')g++;else if(s==='a')y++;else r++;}); return {g,y,r,n:rows.length}; };
  const sp=SEM('pet'), spp=SEM('petpe'), sb=SEM('bandejas');
  const petD=dist(petC,c=>c.margenNeto,sp.v,sp.a), ppD=dist(ppRows,r=>r.margenNeto,spp.v,spp.a), bD=dist(bRows,r=>r.m,sb.v,sb.a);

  // margen operativo combinado
  const netoItems=petC.length+ppRows.length+bRows.length;
  const netoAvg=(petC.reduce((a,c)=>a+c.margenNeto,0)+ppRows.reduce((a,r)=>a+r.margenNeto,0)+bRows.reduce((a,r)=>a+r.m,0))/(netoItems||1);

  // peor ítem global
  const cands=[{mod:'PET',name:(petMin.cli||'-'),m:petMin.margenNeto||0},
    {mod:'Laminado',name:(ppMin.cli||'-')+' '+(ppMin.med||''),m:ppMin.margenNeto||0},
    {mod:'Bandejas',name:(bMin.cli||'-')+' '+(bMin.cod||''),m:bMin.m||0}];
  const worst=cands.reduce((a,b)=>b.m<a.m?b:a,cands[0]);

  return {petC,petAvg,petMin,petMax,petD,ppRows,ppAvg,ppMin,ppMax,ppD,peTot,bRows,bAvg,bMin,bMax,bD,netoAvg,netoItems,worst};
}

let petReportSort='neto', petReportAsc=false, petRepExp=new Set();

function petReportGroups(dim){
  const vr=petVariantes();
  const rows=S.pet.clientes.map(c=>petClientRow(c,vr));
  const keyOf=r=> dim==='cli'?r.cli : dim==='mat'?petMaterial(r.variante) : dim==='col'?petColor(r.variante) : r.variante;
  const map={};
  rows.forEach(r=>{ const k=keyOf(r); (map[k]=map[k]||[]).push(r); });
  let g=Object.keys(map).map(k=>{ const arr=map[k];
    const _t=SEM('pet'); const v=arr.filter(r=>r.margenNeto>=_t.v).length, a=arr.filter(r=>r.margenNeto>=_t.a&&r.margenNeto<_t.v).length, rr=arr.filter(r=>r.margenNeto<_t.a).length;
    return { grupo:k, n:arr.length,
      precio:arr.reduce((s,r)=>s+r.precio,0)/arr.length,
      costo:arr.reduce((s,r)=>s+r.costo,0)/arr.length,
      neto:arr.reduce((s,r)=>s+r.margenNeto,0)/arr.length,
      peor:Math.min.apply(null,arr.map(r=>r.margenNeto)),
      mejor:Math.max.apply(null,arr.map(r=>r.margenNeto)),
      v,a,r:rr, rows:arr }; });
  const key=petReportSort;
  g.sort((x,y)=> petReportAsc ? x[key]-y[key] : y[key]-x[key]);
  return g;
}
function openPetReport(){
  const dims=[['cli','Cliente'],['mat','Material'],['col','Color'],['var','Variante']];
  const sorts=[['neto','Margen'],['precio','Precio'],['costo','Costo'],['n','Ítems']];
  const lab=dims.find(d=>d[0]===petReportDim)[1];
  const g=petReportGroups(petReportDim);
  const vr=petVariantes(); const allRows=S.pet.clientes.map(c=>petClientRow(c,vr));
  const gAvg=allRows.reduce((s,r)=>s+r.margenNeto,0)/(allRows.length||1);
  const enRojo=allRows.filter(r=>r.margenNeto<SEM('pet').a).length;
  const best=g.reduce((m,x)=>x.neto>m.neto?x:m,g[0]||{grupo:'-',neto:0});
  const worst=g.reduce((m,x)=>x.neto<m.neto?x:m,g[0]||{grupo:'-',neto:0});
  const maxAbs=Math.max(0.0001,...g.map(x=>Math.abs(x.neto)));
  const barColor=s=> s==='v'?'var(--green)':s==='a'?'var(--amber)':'var(--red)';

  const bars=g.map(x=>{ const s=semaforo(x.neto,null,null,'pet'); const w=Math.max(3,Math.min(100,Math.abs(x.neto)/maxAbs*100)); const open=petRepExp.has(x.grupo);

        <div style="position:relative;height:20px;background:var(--line2);border-radius:6px;overflow:hidden">

      </tbody></table></div></div>`:''}`;}).join('');

  openModal(`<div class="modal-h"><h3>📊 Informe PET — por ${lab.toLowerCase()}</h3><button class="x" onclick="closeModal()">✕</button></div>
   <div class="modal-b">
     <div class="gkpi" style="margin-bottom:14px">
       <div class="card stat accent"><div class="card-b stat"><div class="k">Clientes</div><div class="v">${allRows.length}</div><div class="d">${g.length} ${lab.toLowerCase()}s</div></div></div>
       <div class="card stat"><div class="card-b stat"><div class="k">Margen operativo prom.</div><div class="v">${pct(gAvg,1)}</div><div class="d">global</div></div></div>
       <div class="card stat"><div class="card-b stat"><div class="k">Mejor ${lab.toLowerCase()}</div><div class="v" style="font-size:18px">${pct(best.neto,1)}</div><div class="d">${best.grupo}</div></div></div>
       <div class="card stat"><div class="card-b stat"><div class="k">En rojo</div><div class="v">${enRojo}</div><div class="d">margen &lt; ${pct(SEM('pet').a,0)}</div></div></div>

     <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px">

   </div>
   <div class="modal-foot"><button class="btn" id="petRepExport">⬇ Exportar informe (Excel)</button><button class="btn primary" onclick="closeModal()">Cerrar</button></div>`,true);
  $$('#modal [data-rdim]').forEach(b=>b.onclick=()=>{ petReportDim=b.dataset.rdim; petRepExp.clear(); openPetReport(); });
  $$('#modal [data-rsort]').forEach(b=>b.onclick=()=>{ petReportSort=b.dataset.rsort; openPetReport(); });

  $$('#modal [data-rgrp]').forEach(b=>b.onclick=()=>{ const k=decodeURIComponent(b.dataset.rgrp); petRepExp.has(k)?petRepExp.delete(k):petRepExp.add(k); openPetReport(); });

async function exportPetReport(dim,groups){
  const labels={cli:'Cliente',mat:'Material',col:'Color',var:'Variante'};

    <div class="modal-b">

    </div>
    <div class="modal-foot"><button class="btn primary" onclick="closeModal()">Cerrar</button></div>`);

  $$('#modal [data-curpdf]').forEach(c=>c.onclick=e=>{ if(e.target.closest('[data-noclick]'))return; generatePetListPDF('__cur__'); });
  $$('#modal [data-hpdf]').forEach(c=>c.onclick=e=>{ if(e.target.closest('[data-noclick]'))return; generatePetListPDF(c.dataset.hpdf); });
  $$('#modal [data-pdfbtn]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); generatePetListPDF(b.dataset.pdfbtn); });
  $$('#modal [data-pact]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const h=S.pet.listHistory.find(x=>x.id==b.dataset.pact); if(!h)return;

function generatePetListPDF(id){
  if(!window.jspdf||!window.jspdf.jsPDF){ toast('Generador de PDF no disponible','err'); return; }
  let label, tc, rows, isCur=(id==='__cur__');
  if(isCur){ label='Lista actual'; tc=TC(); rows=S.pet.clientes.map(c=>({cli:c.cli,v:c.v,act:c.act})); }
  else { const h=(S.pet.listHistory||[]).find(x=>x.id==id); if(!h){toast('Versión no encontrada','err');return;} label=h.label; tc=h.tc; rows=h.rows; }
  const vr=petVariantes();
  const { jsPDF }=window.jspdf;
  const doc=new jsPDF({unit:'pt',format:'a4'});
  const W=doc.internal.pageSize.getWidth();
  // encabezado
  doc.setFillColor(40,168,92); doc.rect(0,0,W,68,'F');
  const logo=winflexLogoDataURL();
  if(logo){ try{ doc.addImage(logo,/jpe?g/.test(logo)?'JPEG':'PNG', 36,11,86,46); }catch(e){} }
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('WINFLEX S.A. — Lista de precios PET Lámina', W-36, 30, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(`${label} · TC ${ars(tc)} · ${new Date().toLocaleDateString('es-AR')}`, W-36, 48, {align:'right'});
  // tabla
  const body=rows.map(r=>{ const nom=(S.pet.variantes[r.v]||S.pet.variantes[0]).nom;
    const row=[r.cli, nom, usd(r.act,2), ars(r.act*tc)];
    if(isCur){ const cr=petClientRow({cli:r.cli,v:r.v,ant:r.act,act:r.act},vr); row.push(usd(cr.costo,2)); row.push(pct(cr.margenNeto,1)); }
    return row; });
  const head=isCur ? [['Cliente','Variante','Precio USD/kg','Precio ARS/kg','Costo USD/kg','M.Oper.']]
                   : [['Cliente','Variante','Precio USD/kg','Precio ARS/kg']];
  doc.autoTable({ head, body, startY:84, theme:'grid', styles:{font:'helvetica',fontSize:9,cellPadding:4},
    headStyles:{fillColor:[31,160,85],textColor:255}, alternateRowStyles:{fillColor:[244,251,246]},
    columnStyles:{0:{halign:'left'},1:{halign:'left'}}, margin:{left:36,right:36} });
  doc.setFontSize(8); doc.setTextColor(120);
  doc.text('Winflex S.A. · Envases especiales · documento generado automáticamente', 36, doc.internal.pageSize.getHeight()-24);
  doc.output('dataurlnewwindow');
}

/* ---- Logo para Excel ---- */
function winflexLogoDataURL(){
  const img=document.querySelector('#login .logo-img')||document.querySelector('.brand-img')||document.querySelector('.logo-img');

}
function addLogoToSheet(wb,ws,ncols){

/* ============================================================
   CALCULADORA DE COSTOS PET (en el momento)
   ============================================================ */
let petCalc=null;
function petCalcDefaults(){
  const p=S.pet.params, proc=petProc();
  petCalc={ vi:0, r:S.pet.variantes[0].r.slice(0,6),
    mp:S.pet.insumos.slice(0,6).map(i=>i.usd),
    tc:Math.round(TC()), merma:(p.merma-p.recuperacion), proc:proc.totalCFlete, flete:true, qty:1000 };
}
function petCalcCompute(){
  const c=petCalc; let mpBase=0; c.r.forEach((x,i)=>mpBase+=x*(c.mp[i]||0));
  const factor=1/(1-c.merma); const mpAjust=mpBase*factor;
  const costoU=mpAjust+c.proc; const sum=c.r.reduce((a,x)=>a+x,0);
  return {mpBase,factor,mpAjust,proc:c.proc,costoU,arsU:costoU*c.tc,sum,
    totalUSD:costoU*c.qty,totalARS:costoU*c.tc*c.qty};
}
function petCalcResultHTML(){
  const c=petCalc, r=petCalcCompute();
  const ok=Math.abs(r.sum-1)<0.001;
  const cods=S.pet.insumos.slice(0,6);
  const aportes=c.r.map((x,i)=>({label:cods[i].cod,val:x*(c.mp[i]||0),color:['var(--amber)','#d6a96d','var(--blue)','#9b6dd6','#444','#2c74c4'][i]||'var(--muted)'}));
  const bar=breakdownBar([{label:'MP ajustada',val:r.mpAjust,color:'var(--amber)'},{label:'Procesamiento',val:r.proc,color:'var(--teal)'}]);
  return `

async function exportPetCalc(){

  rows.push({k:'MP base',v:r.mpBase,d:'USD/kg'});
  rows.push({k:'Factor merma neta',v:r.factor,d:'1 ÷ (1 − '+pct(c.merma,0)+')'});
  rows.push({k:'MP ajustada',v:r.mpAjust,d:'USD/kg'});
  rows.push({k:'Procesamiento '+(c.flete?'c/traslado':'s/traslado'),v:r.proc,d:'USD/kg'});
  rows.push({k:'COSTO UNITARIO',v:r.costoU,d:'USD/kg · '+ars(r.arsU)+'/kg'});
  rows.push({k:'Tipo de cambio',v:c.tc,d:'ARS/USD'});
  rows.push({k:'Cantidad',v:c.qty,d:'kg'});
  rows.push({k:'TOTAL',v:r.totalUSD,d:'USD · '+ars(r.totalARS)});
  dataRows(ws,5,H,rows);
  await download(wb,'Winflex_PET_calculo.xlsx');
}

function openModal(html,wide){ const m=$('#modal'); m.innerHTML=html; m.classList.toggle('wide',!!wide); m.scrollTop=0; $('#modalBg').classList.add('open'); }
function closeModal(){ $('#modalBg').classList.remove('open'); $('#modal').classList.remove('wide'); }
$('#modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });

const MODS={
  pe:{name:'Film PE',unit:'/kg',hasPrice:false},
  pet:{name:'PET Lámina',unit:'/kg',hasPrice:true},
  petpe:{name:'Laminado PET/PE',unit:'/kg',hasPrice:true},
  bandejas:{name:'Bandejas',unit:'/millar',hasPrice:true}
};
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function summarize(mod){
  if(mod==='pe'){ const c=calcPE().total; return {cost:c,margin:null,unit:'/kg'}; }
  if(mod==='pet'){ const vr=petVariantes(); const rows=S.pet.clientes.filter(esActivo).map(c=>petClientRow(c,vr));
    return {cost:rows.reduce((a,r)=>a+r.costo,0)/(rows.length||1), margin:rows.reduce((a,r)=>a+r.margenNeto,0)/(rows.length||1), unit:'/kg'}; }
  if(mod==='petpe'){ const rows=S.petpe.productos.filter(esActivo).map(petpeRow);
    return {cost:rows.reduce((a,r)=>a+r.costo,0)/(rows.length||1), margin:rows.reduce((a,r)=>a+r.margenNeto,0)/(rows.length||1), unit:'/kg'}; }
  if(mod==='bandejas'){ const p=S.bandejas.params; const prods=S.bandejas.productos.map(bandejaCost);
    const cost=prods.reduce((a,r)=>a+r.usdMillar,0)/(prods.length||1);
    const ms=[]; S.bandejas.ensaladeras.filter(esActivo).forEach(e=>Object.entries(e.p).forEach(([cod,v])=>{const pr=e.mon==='USD'?v:v/TC();const co=bandejaCostByCod(cod,e.cajaCli,baFmtDe(e,cod),baEmpDe(e,cod));ms.push(baMargen(pr,co).margenNeto);}));
    Object.entries(S.bandejas.clamshells).forEach(([cod,v])=>{const co=bandejaCostByCod(cod);ms.push(baMargen(v,co).margenNeto);});
    return {cost,margin:ms.reduce((a,x)=>a+x,0)/(ms.length||1),unit:'/millar'}; }
}
function applyScenario(cl,mod,mpM,prM){
  if(mod==='pe') cl.pe.insumos.forEach(i=>i.usd*=mpM);
  if(mod==='pet'){ cl.pet.insumos.forEach(i=>i.usd*=mpM); cl.pet.clientes.forEach(c=>c.act*=prM); }
  if(mod==='petpe'){ cl.petpe.params.costoLaminaPET*=mpM; cl.petpe.params.costoLaminaPE*=mpM;
    // si el costo de laminas esta vinculado a los modulos PET / PE, el shock se aplica a sus insumos
    if(cl.petpe.params.linkPET) cl.pet.insumos.forEach(i=>i.usd*=mpM);
    if(cl.petpe.params.linkPE) cl.pe.insumos.forEach(i=>i.usd*=mpM);
    cl.petpe.productos.forEach(p=>p.precio*=prM); }
  if(mod==='bandejas'){ cl.bandejas.params.mpCristal*=mpM; cl.bandejas.params.mpNegro*=mpM;
    if(cl.bandejas.params.linkPET!==false) cl.pet.insumos.forEach(i=>i.usd*=mpM);
    cl.bandejas.ensaladeras.forEach(e=>{for(const k in e.p)e.p[k]*=prM;}); for(const k in cl.bandejas.clamshells)cl.bandejas.clamshells[k]*=prM; }
}
function scenarioResult(mod,mpPct,prPct,tcVal){
  const orig=S; const cl=clone(orig);
  applyScenario(cl,mod,1+mpPct/100,1+prPct/100);
  cl.tc.value=tcVal; if(cl.tc.usarLista) cl.tc.lista=tcVal;
  S=cl; const scen=summarize(mod); S=orig;
  return scen;
}
function openSim(mod){
  const m=MODS[mod]; const base=summarize(mod);
  openModal(`
    <div class="modal-h"><h3>📊 Simulador · ${m.name}</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <div class="note" style="margin-bottom:14px">Probá escenarios sin tocar la lista. ${m.hasPrice?'Podés aplicar el aumento de precios a la lista real con el botón de abajo.':'Este módulo es un insumo interno (sin precios de venta).'}</div>
      <div class="sim-row head"><div>Variable</div><div>Base</div><div>Escenario</div><div></div></div>
      <div class="sim-row"><div>${mod==='petpe'?'Costo láminas (PET+PE) %':mod==='bandejas'?'Costo MP rPET %':'Precio MP / insumos %'}</div>
        <div class="base">0%</div><div><input id="simMP" type="number" step="1" value="0"></div><div>%</div></div>
      ${m.hasPrice?`<div class="sim-row"><div>Precios de venta %</div><div class="base">0%</div><div><input id="simPR" type="number" step="1" value="0"></div><div>%</div></div>`:'<input type="hidden" id="simPR" value="0">'}
      <div class="sim-row"><div>Tipo de cambio</div><div class="base">${ars(TC())}</div><div><input id="simTC" type="number" step="1" value="${Math.round(TC())}"></div><div>ARS</div></div>

      <div class="grid g2" style="margin-top:18px">
        <div class="card"><div class="card-b stat"><div class="k">Costo promedio</div>
          <div class="v" id="rCost">${usd(base.cost,m.unit==='/millar'?2:3)}<small>${base.unit}</small></div>
          <div class="d" id="rCostD">sin cambios</div></div></div>
        <div class="card"><div class="card-b stat"><div class="k">Margen ${mod==='pe'?'—':'operativo'} prom.</div>
          <div class="v" id="rMar">${base.margin!=null?pct(base.margin,1):'—'}</div>
          <div class="d" id="rMarD">sin cambios</div></div></div>
      </div>
    </div>
    <div class="modal-foot">
      ${m.hasPrice?`<button class="btn amber" id="simApplyPrice">Aplicar aumento de precios a la lista</button>`:''}
      <button class="btn primary" onclick="closeModal()">Cerrar</button>
    </div>`);

  function recompute(){
    const mp=num($('#simMP').value), pr=num($('#simPR').value), tc=num($('#simTC').value)||TC();
    const scen=scenarioResult(mod,mp,pr,tc);
    const dC=base.cost?(scen.cost-base.cost)/base.cost:0;
    $('#rCost').innerHTML=usd(scen.cost,m.unit==='/millar'?2:3)+`<small>${base.unit}</small>`;
    $('#rCostD').innerHTML=`<span class="delta ${dC>0.0001?'down':dC<-0.0001?'up':'flat'}">${dC>0?'+':''}${pct(dC,1)} vs base</span>`;
    if(base.margin!=null){ $('#rMar').textContent=pct(scen.margin,1);
      const dM=scen.margin-base.margin;
      $('#rMarD').innerHTML=`<span class="delta ${dM>0.0001?'up':dM<-0.0001?'down':'flat'}">${dM>0?'+':''}${(dM*100).toFixed(1)} pts</span>`; }
  }
  $('#simMP').oninput=recompute; if($('#simPR').oninput!==undefined)$('#simPR').oninput=recompute; $('#simTC').oninput=recompute;
  if($('#simApplyPrice')) $('#simApplyPrice').onclick=()=>{
    const pr=num($('#simPR').value);
    if(!pr){ toast('Poné un % de aumento primero','err'); return; }
    if(!confirm(`¿Aplicar +${pr}% a TODOS los precios de venta de ${m.name}? Conviene guardar una versión antes.`)) return;
    applyScenario(S,mod,1,1+pr/100); commit(); closeModal(); renderActive(); toast(`Precios de ${m.name} actualizados +${pr}%`,'ok');
  };
}
const openPetSim=()=>openSim('pet'), openPeSim=()=>openSim('pe'), openPpSim=()=>openSim('petpe'), openBandejasSim=()=>openSim('bandejas');
